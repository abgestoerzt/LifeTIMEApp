{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entries List</title>
    <link rel="stylesheet" href="{% static 'lifecalendar/style.css' %}">
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
</head>
<body>
    <header>
        <h1>Life Calendar Entries</h1>
    </header>
    
    <main>
        {% block content %}
        <!-- Content goes here -->
        <body>
  <div id='calendar'></div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const calendarEl = document.getElementById('calendar');

      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'timeGridWeek', // week view
        events: '/api/calendar/',    // Django endpoint to fetch events
        nowIndicator: true,
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'timeGridWeek,timeGridDay'
        },
        eventClick: function(info) {
          alert(info.event.title + ": " + info.event.start);
        }
      });

      calendar.render();
    });
  </script>
</body>
        {% endblock %}
    
    </main>

    <footer>
        <p>&copy; {% now "Y" %} LifeTime App</p>
    </footer>
</body>
</html>
