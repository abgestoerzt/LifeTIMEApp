{% extends "base.html" %}
{% block title %}Einladung{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 text-center">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <div class="fs-1 mb-3">🔗</div>
        <h2 class="mb-2">Einladecode</h2>
        <p class="text-muted">Teile diesen Code mit deiner Partner:in. Er ist 7 Tage gültig.</p>
        <div class="bg-light rounded p-3 my-4">
          <code class="fs-5 user-select-all">{{ session.invite_code }}</code>
        </div>
        <p class="text-muted small">
          Deine Partner:in gibt diesen Code unter
          <strong>Paar beitreten</strong> ein.
        </p>
        <a href="{% url 'dashboard' %}" class="btn btn-outline-dark mt-2">Zum Dashboard</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
